name: Contract validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - name: Install validators
        run: python -m pip install --requirement requirements-contracts.txt
      - name: Validate OpenAPI 3.1
        run: openapi-spec-validator docs/contracts/openapi.yaml
      - name: Validate JSON Schema examples
        shell: bash
        run: |
          set -euo pipefail
          for example in docs/contracts/examples/*.json; do
            name="$(basename "$example")"
            schema="docs/contracts/schemas/$name"
            check-jsonschema --schemafile "$schema" "$example"
          done
